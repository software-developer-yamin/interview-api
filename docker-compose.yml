services:
  postgres:
    image: postgres:17-alpine
    container_name: interview-api-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview_secret
      POSTGRES_DB: interview_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-api-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://interview:interview_secret@postgres:5432/interview_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
